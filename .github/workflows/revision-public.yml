name: October revision public acceptance
# Focused public co-op follow-up; full solo and prior full campaign runs remain separately recorded.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/revision-public.yml']
permissions:
  contents: read
env:
  BROWSER_BASE_URL: https://tiny-teamwork-last-spark.onrender.com
jobs:
  public-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {party: 2, first: 8, last: 10}
          - {party: 4, first: 5, last: 5}
          - {party: 4, first: 15, last: 15}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Confirm deployed game source
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          for(const p of ['revision-world.js','revision-simulation.js','revision-art.js','simulation.js','physics.js','game.js','environment-art.js','title-menu.js','audio.js','network.js']) {
            const response=await fetch(process.env.BROWSER_BASE_URL+'/js/'+p);
            assert.equal(response.status,200);
            assert.equal((await response.text()).replaceAll('\r\n','\n'),(await readFile('public/js/'+p,'utf8')).replaceAll('\r\n','\n'),p+' deployed source differs');
          }
          console.log('Deployed runtime modules match checked-out source.');
          JS
      - run: node scripts/revision-campaign-test.mjs
        env:
          TEST_PARTY: ${{ matrix.party }}
          TEST_FIRST_LEVEL: ${{ matrix.first }}
          TEST_LAST_LEVEL: ${{ matrix.last }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-revision-campaign-${{ matrix.party }}
          path: artifacts/browser-campaign/
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-test.mjs
        env:
          TEST_BASE_URL: https://tiny-teamwork-last-spark.onrender.com
      - run: node scripts/revision-network-test.mjs
        env:
          TEST_BASE_URL: https://tiny-teamwork-last-spark.onrender.com
      - run: node scripts/revision-browser-test.mjs
      - name: Capture detailed biome bridges
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:960,height:540}});
            await page.goto(process.env.BROWSER_BASE_URL);
            await page.locator('#menu-single').waitFor();
            for(const level of [2,7,12]) {
              await page.evaluate(async level=>{
                const {buildLevel}=await import('/js/world.js'),{drawGame}=await import('/js/art.js'),{createPlayer}=await import('/js/physics.js');
                const w=buildLevel(level,1),sw=w.switches[0];sw.active=true;
                w.platforms.push({x:sw.bridgeX,y:sw.bridgeY,w:sw.bridgeW,h:8,kind:'switch-bridge'});
                const p=createPlayer('visual-fixture',sw.bridgeX+sw.bridgeW/2,sw.bridgeY-22);
                document.querySelector('#bridge-preview')?.remove();
                const c=document.createElement('canvas');c.id='bridge-preview';c.width=960;c.height=540;c.style.cssText='position:fixed;inset:0;z-index:999999;width:960px;height:540px;image-rendering:pixelated';document.body.append(c);
                const ctx=c.getContext('2d');ctx.scale(3,3);ctx.imageSmoothingEnabled=false;
                drawGame(ctx,w,p,[],p.x-160,{cameraY:p.y-95,clock:1200,tick:300});
              },level);
              const shot=await page.locator('#bridge-preview').screenshot({path:`artifacts/revision/bridge-${level}.png`});
              console.log(`BRIDGE_${level}_BASE64_BEGIN`+shot.toString('base64')+`BRIDGE_${level}_BASE64_END`);
            }
            console.log('BRIDGE RENDER PASS: detached city, forest and factory visual fixtures.');
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-revision-browser
          path: artifacts/revision/
