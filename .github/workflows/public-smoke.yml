name: Public multiplayer smoke
# Final 0.3.0 HTTPS/WSS check after the completed public campaigns and quiet interval.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-multiplayer-smoke
  cancel-in-progress: false
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_BASE_URL: https://tiny-teamwork-last-spark.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - run: npm run test:multiplayer
