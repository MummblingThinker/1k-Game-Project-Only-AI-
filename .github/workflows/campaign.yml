name: Campaign and browser regression
on:
  workflow_dispatch:
  push:
    paths:
      - public/**
      - server/**
      - scripts/**
      - package*.json
      - .github/workflows/campaign.yml
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:adversarial
      - run: npm run test:jitter
      - run: npm run test:live-campaign
      - run: npm run test:disconnect
      - run: npm run test:abuse
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-browser-evidence
          path: artifacts/
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-flow-test.mjs
      - run: node scripts/browser-cadence-test.mjs
      - run: node scripts/browser-performance-test.mjs
      - run: node scripts/browser-restart-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-flow-evidence
          path: |
            artifacts/flow/
            artifacts/cadence/
            artifacts/performance/
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-rescue-test.mjs
      - run: node scripts/browser-giant-test.mjs
      - run: node scripts/browser-memory-test.mjs
      - run: node scripts/browser-hazards-test.mjs
      - run: node scripts/browser-carry-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-evidence
          path: |
            artifacts/rescue/
            artifacts/giant/
            artifacts/memory/
            artifacts/hazards/
            artifacts/carry/
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/compatibility-test.mjs
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.browser }}
          path: artifacts/
