name: Inspect saved campaign evidence
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-campaign.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41029627746
          name: public-campaign-2
          path: artifacts/saved-campaign
      - run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          console.log(fs.readFileSync('artifacts/saved-campaign/result.json','utf8'));
          for(const level of [10,15])console.log('STAGE'+level+'_BASE64_BEGIN'+fs.readFileSync('artifacts/saved-campaign/stage-'+level+'.jpg').toString('base64')+'STAGE'+level+'_BASE64_END');
          JS
