name: October gameplay revision
on:
  workflow_dispatch:
  push:
    paths: ['public/**', 'server/**', 'scripts/**', 'package*.json', '.github/workflows/revision.yml']
permissions:
  contents: read
jobs:
  rules-and-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
      - run: node scripts/revision-network-test.mjs
      - run: node scripts/revision-route-test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/revision-browser-test.mjs
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-${{ matrix.browser }}
          path: artifacts/revision/
