name: Public co-op campaigns
# Live 13744978; repeat all 15 levels after arena clearance fix, with full snapshot/caption audits.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-campaign
  cancel-in-progress: false
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        party: [2, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-campaign-test.mjs
        env:
          BROWSER_BASE_URL: https://tiny-teamwork-last-spark.onrender.com
          TEST_PARTY: ${{ matrix.party }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-campaign-${{ matrix.party }}
          path: artifacts/browser-campaign/
