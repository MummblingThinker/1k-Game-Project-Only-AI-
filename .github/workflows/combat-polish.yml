name: Combat polish acceptance
on:
  workflow_dispatch:
  push:
    paths: ['scripts/boss-hud-layout-test.mjs', 'public/js/power-cells.js', 'scripts/power-cells-test.mjs', 'scripts/power-cell-browser-test.mjs', 'public/js/boss-timing.js', 'public/js/audio.js', 'scripts/audio-test.mjs', 'scripts/combat-audio-browser-test.mjs', 'scripts/boss-stress-test.mjs', '.github/workflows/combat-polish.yml']
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run test:encounters
      - run: node scripts/boss-stress-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-stress
          path: artifacts/boss-stress.json
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Provide a virtual audio output for headless browser engines
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa_audio
          pactl set-default-sink qa_audio
      - run: node scripts/combat-audio-browser-test.mjs
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: node scripts/power-cell-browser-test.mjs
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power-cell-${{ matrix.browser }}
          path: artifacts/power-cell/
      - run: node scripts/boss-hud-layout-test.mjs
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-layout-${{ matrix.browser }}
          path: artifacts/boss-layout/
