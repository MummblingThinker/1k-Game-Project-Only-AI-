name: Full browser co-op campaign
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/browser-campaign-test.mjs
      - scripts/route-driver.mjs
      - .github/workflows/browser-campaign.yml
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        party: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-campaign-test.mjs
        env:
          TEST_PARTY: ${{ matrix.party }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-campaign-${{ matrix.party }}
          path: artifacts/browser-campaign/
