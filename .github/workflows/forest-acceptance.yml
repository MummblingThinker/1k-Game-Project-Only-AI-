name: Public forest transition retest
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/forest-acceptance.yml']
permissions:
  contents: read
jobs:
  forest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/ground-route-cadence-test.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/revision-campaign-test.mjs
        env:
          BROWSER_BASE_URL: https://tiny-teamwork-last-spark.onrender.com
          TEST_PARTY: 1
          TEST_FIRST_LEVEL: 10
          TEST_LAST_LEVEL: 11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forest-transition
          path: artifacts/browser-campaign/
